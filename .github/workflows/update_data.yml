name: Update Marine Conditions JSON

on:
  schedule:
    - cron: "*/12 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight HTTP client
        run: pip install --disable-pip-version-check --quiet requests urllib3

      - name: Fetch latest sensor data
        run: python fetch_data.py

      - name: Commit data.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet data.json; then
            git add data.json
            git commit -m "chore(data): update marine observations [skip ci]"
            git push
          else
            echo "No changes in data.json; skipping commit."
          fi
