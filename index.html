<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b0f14" />
  <title>Harbour & Bay 6x3 Widget</title>
  <style>
    :root {
      --bg: #0b0f14;
      --card: #141b24;
      --card-sub: #10161e;
      --border: #222c3a;
      --border-hi: #2d3c50;
      --text: #f1f5f9;
      --muted: #8b9bb0;
      --dim: #5d6e85;
      --cyan: #38bdf8;
      --green: #22c55e;
      --amber: #f59e0b;
      --orange: #f97316;
      --red: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      font-variant-numeric: tabular-nums;
      overflow: hidden;
      user-select: none;
    }

    .widget-shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-height: 360px;
      padding: 6px;
      gap: 5px;
    }

    /* Compact Top Bar: Status + Tides + Refresh */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 8px;
      gap: 6px;
      flex-shrink: 0;
    }

    .status-group {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      flex-shrink: 0;
    }

    .status-dot.stale {
      background: var(--amber);
      box-shadow: 0 0 6px var(--amber);
    }

    .updated-time {
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tide-row {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.66rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: nowrap;
    }

    .tide-live {
      color: var(--cyan);
      font-weight: 700;
    }

    .tide-ev {
      color: var(--text);
      background: var(--card-sub);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 4px;
    }

    .tide-up { color: var(--cyan); }
    .tide-dn { color: var(--muted); }

    .refresh-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .refresh-btn.spinning svg {
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Two Side-by-Side Waterway Columns */
    .columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      flex: 1;
      min-height: 0;
    }

      flex-direction: column;
      background
