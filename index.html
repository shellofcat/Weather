<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b0f14" />
  <title>Harbour & Bay 3x6</title>
  <style>
    :root {
      --bg: #0b0f14;
      --card: #151c25;
      --card-sub: #10161e;
      --border: #232d3b;
      --border-hi: #2e3e52;
      --text: #f1f5f9;
      --muted: #8b9bb0;
      --dim: #5d6e85;
      --cyan: #38bdf8;
      --green: #22c55e;
      --amber: #f59e0b;
      --orange: #f97316;
      --red: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      font-variant-numeric: tabular-nums;
      overflow: hidden;
    }

    /* Top padding clears WebsiteWidget's corner overlays; flex fills 100% of 3x6 height */
    .wrap {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 26px 5px 5px 5px;
      gap: 4px;
    }

    /* Single Compact Tide + Live Status Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 4px 6px;
      gap: 3px;
      flex-shrink: 0;
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.62rem;
      font-weight: 800;
      color: var(--cyan);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: nowrap;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      flex-shrink: 0;
    }

    .status-dot.stale {
      background: var(--amber);
      box-shadow: 0 0 6px var(--amber);
    }

    .tide-grp {
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: 0.58rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: nowrap;
    }

    .tide-pill {
      background: var(--card-sub);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 4px;
      color: var(--text);
    }

    .tide-up { color: var(--cyan); font-weight: 700; }
    .tide-dn { color: var(--muted); font-weight: 700; }

    /* Both Waterway Sections stretch equally to eliminate bottom black gap */
    .waterway {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      gap: 3px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2px;
      flex-shrink: 0;
    }

    .section-title {
      font-size: 0.60rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      color: var(--cyan);
      text-transform: uppercase;
    }

    .section-sub {
      font-size: 0.52rem;
      color: var(--dim);
      text-transform: uppercase;
    }

    /* 2x2 Wind Grid fills available vertical space evenly */
    .wind-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 3px;
      flex: 1;
      min-height: 0;
    }

    .wind-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px 5px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
      min-height: 0;
    }

    .station-name {
      font-size: 0.58rem;
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .wind-speed {
      font-size: 0.94rem;
      font-weight: 800;
      line-height: 1;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .wind-unit {
      font-size: 0.54rem;
      font-weight: 500;
      color: var(--muted);
      margin-left: 1px;
    }

    .spd-calm { color: #f1f5f9; }
    .spd-fresh { color: var(--cyan); }
    .spd-mod { color: var(--amber); }
    .spd-strong { color: var(--orange); }
    .spd-gale { color: var(--red); }

    .wind-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.56rem;
      padding-top: 2px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .gust-badge {
      color: var(--muted);
    }

    .gust-badge strong {
      color: var(--text);
      font-weight: 600;
    }

    .dir-badge {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      font-weight: 600;
      color: var(--text);
    }

    .dir-arrow {
      width: 8px;
      height: 8px;
      color: var(--cyan);
      flex-shrink: 0;
    }

    /* Compact Single-Line Offshore Swell Bar */
    .swell-banner {
      background: linear-gradient(180deg, #151e2b 0%, #111720 100%);
      border: 1px solid var(--border-hi);
      border-radius: 6px;
      padding: 4px 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 3px;
      flex-shrink: 0;
    }

    .swell-left {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
    }

    .swell-title {
      font-size: 0.54rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--cyan);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .swell-sub {
      font-size: 0.56rem;
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .swell-metrics {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      flex-shrink: 0;
    }

    .swell-stat {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .swell-val {
      font-size: 0.66rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.05;
    }

    .swell-lbl {
      font-size: 0.48rem;
      color: var(--muted);
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- Single Compact Status & Tide Bar -->
    <div class="top-bar">
      <div class="live-badge">
        <span id="statusDot" class="status-dot"></span>
        <span id="tideLiveGauge">--m</span>
      </div>
      <div class="tide-grp" id="tideEvents">
        <span class="tide-pill"><span class="tide-up">▲</span>--</span>
        <span class="tide-pill"><span class="tide-dn">▼</span>--</span>
      </div>
    </div>

    <!-- Sydney Harbour -->
    <section class="waterway">
      <div class="section-head">
        <span class="section-title">Sydney Harbour</span>
        <span class="section-sub" id="updatedText">kts · true</span>
      </div>
      <div class="wind-grid" id="sydWindGrid"></div>
      <div class="swell-banner" id="sydSwellBanner"></div>
    </section>

    <!-- Botany Bay -->
    <section class="waterway">
      <div class="section-head">
        <span class="section-title">Botany Bay</span>
        <span class="section-sub">kts · true</span>
      </div>
      <div class="wind-grid" id="botWindGrid"></div>
      <div class="swell-banner" id="botSwellBanner"></div>
    </section>
  </div>

  <script>
    function speedClass(ktsStr) {
      const v = parseFloat(ktsStr);
      if (isNaN(v)) return "spd-calm";
      if (v >= 25) return "spd-gale";
      if (v >= 18) return "spd-strong";
      if (v >= 12) return "spd-mod";
      if (v >= 7) return "spd-fresh";
      return "spd-calm";
    }

    function renderArrow(degVal) {
      const deg = parseFloat(degVal);
      if (isNaN(deg)) return "";
      const rot = (deg + 180) % 360;
      return `<svg class="dir-arrow" style="transform: rotate(${rot}deg)" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L19 21L12 17L5 21L12 2Z"/></svg>`;
    }

    function renderWindGrid(containerId, stations) {
      const el = document.getElementById(containerId);
      el.innerHTML = (stations || []).map(st => {
        const cls = speedClass(st.speed_kts);
        const degText = st.dir_deg !== "--" ? `${st.dir_deg}°` : "";
        return `
          <div class="wind-card">
            <div class="station-name">${st.name}</div>
            <div class="wind-speed ${cls}">${st.speed_kts}<span class="wind-unit">kts</span></div>
            <div class="wind-meta">
              <span class="gust-badge">G<strong>${st.gust_kts}</strong></span>
              <span class="dir-badge">${renderArrow(st.dir_deg)}<span>${st.dir_cardinal} ${degText}</span></span>
            </div>
          </div>
        `;
      }).join("");
    }

    function renderSwellBanner(containerId, swell, shortLabel) {
      const el = document.getElementById(containerId);
      if (!swell) return;
      const degText = swell.dir_deg !== "--" ? `${swell.dir_deg}°` : "";
      el.innerHTML = `
        <div class="swell-left">
          <span class="swell-title">${shortLabel}</span>
          <span class="swell-sub dir-badge">${renderArrow(swell.dir_deg)}<span>${swell.dir_cardinal} ${degText}</span></span>
        </div>
        <div class="swell-metrics">
          <div class="swell-stat">
            <span class="swell-val">${swell.hs_m !== "--" ? swell.hs_m + "m" : "--"}</span>
            <span class="swell-lbl">Hs</span>
          </div>
          <div class="swell-stat">
            <span class="swell-val">${swell.hmax_m !== "--" ? swell.hmax_m + "m" : "--"}</span>
            <span class="swell-lbl">Max</span>
          </div>
          <div class="swell-stat">
            <span class="swell-val">${swell.tp_s !== "--" ? swell.tp_s + "s" : "--"}</span>
            <span class="swell-lbl">Tp</span>
          </div>
        </div>
      `;
    }

    function renderTides(tides) {
      if (!tides) return;
      const sydLive = tides.sydney_live_m && tides.sydney_live_m !== "--" ? `${tides.sydney_live_m}m` : "--m";
      document.getElementById("tideLiveGauge").textContent = sydLive;

      const events = (tides.events || []).slice(0, 2);
      document.getElementById("tideEvents").innerHTML = events.map(ev => {
        const isHigh = ev.type === "H";
        const arrow = isHigh ? `<span class="tide-up">▲</span>` : `<span class="tide-dn">▼</span>`;
        const ht = ev.height_m !== "--" ? ` ${ev.height_m}m` : "";
        return `<span class="tide-pill">${arrow}${ev.time}${ht}</span>`;
      }).join("");
    }

    async function loadData() {
      try {
        const res = await fetch(`./data.json?t=${Date.now()}`, { cache: "no-store" });
        if (!res.ok) throw new Error();
        const data = await res.json();

        const dot = document.getElementById("statusDot");
        if (data.updated_iso) {
          const ageMins = (Date.now() - new Date(data.updated_iso).getTime()) / 60000;
          dot.classList.toggle("stale", ageMins > 30);
        }
        if (data.updated_display) {
          document.getElementById("updatedText").textContent = data.updated_display;
        }

        renderTides(data.tides);
        if (data.sydney) {
          renderWindGrid("sydWindGrid", data.sydney.winds);
          renderSwellBanner("sydSwellBanner", data.sydney.swell, "Syd Offshore");
        }
        if (data.botany) {
          renderWindGrid("botWindGrid", data.botany.winds);
          renderSwellBanner("botSwellBanner", data.botany.swell, "Botany Offshore");
        }
      } catch (e) {
        document.getElementById("updatedText").textContent = "Offline";
        document.getElementById("statusDot").classList.add("stale");
      }
    }

    loadData();
  </script>
</body>
</html>
