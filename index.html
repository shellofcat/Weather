<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b0f14" />
  <title>Harbour & Bay Obs</title>
  <style>
    :root {
      --bg: #0b0f14;
      --card: #151c25;
      --card-sub: #10161e;
      --border: #232d3b;
      --border-hi: #2e3e52;
      --text: #f1f5f9;
      --muted: #8b9bb0;
      --dim: #5d6e85;
      --cyan: #38bdf8;
      --green: #22c55e;
      --amber: #f59e0b;
      --orange: #f97316;
      --red: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      font-variant-numeric: tabular-nums;
      overflow-x: hidden;
    }

    .wrap {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 6px 7px;
      gap: 5px;
    }

    /* Compact Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 5px 9px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .brand-icon {
      width: 16px;
      height: 16px;
      color: var(--cyan);
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.1;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.63rem;
      color: var(--muted);
      margin-top: 1px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      flex-shrink: 0;
    }

    .status-dot.stale {
      background: var(--amber);
      box-shadow: 0 0 6px var(--amber);
    }

    .refresh-btn {
      background: var(--card-sub);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 7px;
      width: 24px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .refresh-btn.spinning svg {
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Compact Tide Strip */
    .tide-strip {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 5px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      font-size: 0.66rem;
    }

    .tide-live {
      font-weight: 700;
      color: var(--cyan);
      white-space: nowrap;
    }

    .tide-events {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .tide-pill {
      background: var(--card-sub);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 2px 5px;
      font-size: 0.63rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: nowrap;
    }

    .tide-up { color: var(--cyan); font-weight: 700; }
    .tide-dn { color: var(--muted); font-weight: 700; }

    /* Waterway Section */
    .waterway {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1px 2px 0 2px;
    }

    .section-title {
      font-size: 0.66rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .section-sub {
      font-size: 0.58rem;
      color: var(--dim);
    }

    /* 2x2 Wind Grid */
    .wind-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
    }

    .wind-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 7px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .station-name {
      font-size: 0.64rem;
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .wind-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 3px;
    }

    .wind-speed {
      font-size: 1.02rem;
      font-weight: 800;
      line-height: 1.1;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .wind-unit {
      font-size: 0.60rem;
      font-weight: 500;
      color: var(--muted);
      margin-left: 1px;
    }

    .spd-calm { color: #f1f5f9; }
    .spd-fresh { color: var(--cyan); }
    .spd-mod { color: var(--amber); }
    .spd-strong { color: var(--orange); }
    .spd-gale { color: var(--red); }

    .wind-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.63rem;
      padding-top: 2px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .gust-badge {
      color: var(--muted);
    }

    .gust-badge strong {
      color: var(--text);
      font-weight: 600;
    }

    .dir-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-weight: 600;
      color: var(--text);
    }

    .dir-arrow {
      width: 10px;
      height: 10px;
      color: var(--cyan);
      flex-shrink: 0;
    }

    /* Compact Offshore Swell Banner */
    .swell-banner {
      background: linear-gradient(180deg, #151e2b 0%, #111720 100%);
      border: 1px solid var(--border-hi);
      border-radius: 8px;
      padding: 5px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .swell-left {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
    }

    .swell-title {
      font-size: 0.60rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--cyan);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .swell-sub {
      font-size: 0.62rem;
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .swell-metrics {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      flex-shrink: 0;
    }

    .swell-stat {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .swell-val {
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.1;
    }

    .swell-lbl {
      font-size: 0.54rem;
      color: var(--muted);
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M2 12c2-2.5 4-2.5 6 0s4 2.5 6 0 4-2.5 6 0"/>
          <path d="M2 17c2-2.5 4-2.5 6 0s4 2.5 6 0 4-2.5 6 0"/>
          <circle cx="12" cy="6" r="2"/>
        </svg>
        <div>
          <div class="brand-title">Harbour &amp; Bay Obs</div>
          <div class="status-row">
            <span id="statusDot" class="status-dot"></span>
            <span id="updatedText">Loading...</span>
          </div>
        </div>
      </div>
      <button id="refreshBtn" class="refresh-btn" aria-label="Refresh">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
          <polyline points="21 3 21 9 15 9"/>
        </svg>
      </button>
    </header>

    <!-- Tide Strip -->
    <section class="tide-strip">
      <div class="tide-live" id="tideLiveGauge">TIDE --</div>
      <div class="tide-events" id="tideEvents">
        <span class="tide-pill"><span class="tide-up">▲</span> H --</span>
        <span class="tide-pill"><span class="tide-dn">▼</span> L --</span>
      </div>
    </section>

    <!-- Sydney Harbour -->
    <section class="waterway">
      <div class="section-head">
        <span class="section-title">Sydney Harbour</span>
        <span class="section-sub">Knots · True</span>
      </div>
      <div class="wind-grid" id="sydWindGrid"></div>
      <div class="swell-banner" id="sydSwellBanner"></div>
    </section>

    <!-- Botany Bay -->
    <section class="waterway">
      <div class="section-head">
        <span class="section-title">Botany Bay</span>
        <span class="section-sub">Knots · True</span>
      </div>
      <div class="wind-grid" id="botWindGrid"></div>
      <div class="swell-banner" id="botSwellBanner"></div>
    </section>
  </div>

  <script>
    function speedClass(ktsStr) {
      const v = parseFloat(ktsStr);
      if (isNaN(v)) return "spd-calm";
      if (v >= 25) return "spd-gale";
      if (v >= 18) return "spd-strong";
      if (v >= 12) return "spd-mod";
      if (v >= 7) return "spd-fresh";
      return "spd-calm";
    }

    function renderArrow(degVal) {
      const deg = parseFloat(degVal);
      if (isNaN(deg)) return "";
      const rot = (deg + 180) % 360;
      return `<svg class="dir-arrow" style="transform: rotate(${rot}deg)" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L19 21L12 17L5 21L12 2Z"/></svg>`;
    }

    function renderWindGrid(containerId, stations) {
      const el = document.getElementById(containerId);
      el.innerHTML = (stations || []).map(st => {
        const cls = speedClass(st.speed_kts);
        const degText = st.dir_deg !== "--" ? `${st.dir_deg}°` : "";
        return `
          <div class="wind-card">
            <div class="station-name">${st.name}</div>
            <div class="wind-row">
              <div class="wind-speed ${cls}">${st.speed_kts}<span class="wind-unit">kts</span></div>
            </div>
            <div class="wind-meta">
              <span class="gust-badge">G <strong>${st.gust_kts}</strong></span>
              <span class="dir-badge">${renderArrow(st.dir_deg)}<span>${st.dir_cardinal} ${degText}</span></span>
            </div>
          </div>
        `;
      }).join("");
    }

    function renderSwellBanner(containerId, swell) {
      const el = document.getElementById(containerId);
      if (!swell) return;
      const degText = swell.dir_deg !== "--" ? `${swell.dir_deg}°` : "";
      el.innerHTML = `
        <div class="swell-left">
          <span class="swell-title">${swell.name}</span>
          <span class="swell-sub dir-badge">${renderArrow(swell.dir_deg)}<span>${swell.dir_cardinal} ${degText}</span></span>
        </div>
        <div class="swell-metrics">
          <div class="swell-stat">
            <span class="swell-val">${swell.hs_m !== "--" ? swell.hs_m + "m" : "--"}</span>
            <span class="swell-lbl">Hs</span>
          </div>
          <div class="swell-stat">
            <span class="swell-val">${swell.hmax_m !== "--" ? swell.hmax_m + "m" : "--"}</span>
            <span class="swell-lbl">Max</span>
          </div>
          <div class="swell-stat">
            <span class="swell-val">${swell.tp_s !== "--" ? swell.tp_s + "s" : "--"}</span>
            <span class="swell-lbl">Tp</span>
          </div>
        </div>
      `;
    }

    function renderTides(tides) {
      if (!tides) return;
      const sydLive = tides.sydney_live_m && tides.sydney_live_m !== "--" ? `${tides.sydney_live_m}m` : "--";
      document.getElementById("tideLiveGauge").textContent = `TIDE ${sydLive}`;

      const events = (tides.events || []).slice(0, 2);
      document.getElementById("tideEvents").innerHTML = events.map(ev => {
        const isHigh = ev.type === "H";
        const arrow = isHigh ? `<span class="tide-up">▲</span>` : `<span class="tide-dn">▼</span>`;
        const ht = ev.height_m !== "--" ? ` ${ev.height_m}m` : "";
        return `<span class="tide-pill">${arrow} ${ev.time}${ht}</span>`;
      }).join("");
    }

    async function loadData() {
      const btn = document.getElementById("refreshBtn");
      btn.classList.add("spinning");
      try {
        const res = await fetch(`./data.json?t=${Date.now()}`, { cache: "no-store" });
        if (!res.ok) throw new Error();
        const data = await res.json();

        const dot = document.getElementById("statusDot");
        if (data.updated_iso) {
          const ageMins = (Date.now() - new Date(data.updated_iso).getTime()) / 60000;
          dot.classList.toggle("stale", ageMins > 30);
        }
        document.getElementById("updatedText").textContent = data.updated_display || "Updated";

        renderTides(data.tides);
        if (data.sydney) {
          renderWindGrid("sydWindGrid", data.sydney.winds);
          renderSwellBanner("sydSwellBanner", data.sydney.swell);
        }
        if (data.botany) {
          renderWindGrid("botWindGrid", data.botany.winds);
          renderSwellBanner("botSwellBanner", data.botany.swell);
        }
      } catch (e) {
        document.getElementById("updatedText").textContent = "Offline";
        document.getElementById("statusDot").classList.add("stale");
      } finally {
        setTimeout(() => btn.classList.remove("spinning"), 250);
      }
    }

    document.getElementById("refreshBtn").addEventListener("click", loadData);
    loadData();
  </script>
</body>
</html>
